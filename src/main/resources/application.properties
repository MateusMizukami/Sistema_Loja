spring.application.name=vendas

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/loja?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# O console do H2 não é usado com MySQL (e também desliga a liberação dele no SecurityConfig)
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=uploads

# ASAAS
app.asaas.api-key=${ASAAS_API_KEY:}
app.asaas.base-url=https://api-sandbox.asaas.com/v3
app.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
app.pagamento.expiracao-minutos=30