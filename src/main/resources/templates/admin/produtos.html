<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos - Painel do gerente')}"></head>
<body class="area-admin">
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" class="container" aria-labelledby="titulo">
    <h1 id="titulo">Painel do gerente</h1>
    <nav th:replace="~{fragments/layout :: menuAdmin('produtos')}"></nav>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="barra-filtro">
        <h2>Produtos</h2>
        <a class="botao botao-destaque" th:href="@{/admin/produtos/novo}">Novo produto</a>
    </div>

    <form th:action="@{/admin/produtos}" method="get" role="search" class="busca-admin">
        <label for="termo" class="sr-only">Buscar produto pelo nome</label>
        <input type="search" id="termo" name="termo" th:value="${termo}" placeholder="Buscar pelo nome" maxlength="100">
        <button type="submit" class="botao">Buscar</button>
        <a th:if="${!termo.isEmpty()}" th:href="@{/admin/produtos}">Limpar</a>
    </form>

    <p class="contagem" role="status" th:text="|${pagina.totalElements} produto(s)|">0 produto(s)</p>

    <div class="vazio" th:if="${produtos.empty}"><p>Nenhum produto encontrado.</p></div>

    <div class="tabela-rolavel" th:unless="${produtos.empty}">
        <table class="tabela">
            <caption class="sr-only">Lista de produtos</caption>
            <thead>
            <tr>
                <th scope="col"><span class="sr-only">Imagem</span></th>
                <th scope="col">Produto</th>
                <th scope="col">Categoria</th>
                <th scope="col">Preço</th>
                <th scope="col">Estoque</th>
                <th scope="col">Situação</th>
                <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produtos}">
                <td><img class="miniatura" alt=""
                         th:src="${#strings.isEmpty(p.urlImagem)} ? @{/img/placeholder.svg} : @{${p.urlImagem}}"></td>
                <th scope="row" th:text="${p.nome}">Produto</th>
                <td th:text="${p.categoria != null} ? ${p.categoria.nome} : '—'">Categoria</td>
                <td><span th:replace="~{fragments/produto :: preco(${p.preco})}"></span></td>
                <td th:classappend="${p.estoque le 5} ? 'estoque-baixo-celula'" th:text="${p.estoque}">0</td>
                <td><span class="status" th:classappend="${p.ativo} ? 'status-finalizado' : 'status-cancelado'"
                          th:text="${p.ativo} ? 'Ativo' : 'Inativo'">Ativo</span></td>
                <td class="acoes-celula">
                    <a class="botao" th:href="@{/admin/produtos/{id}/editar(id=${p.id})}"
                       th:attr="aria-label=|Editar ${p.nome}|">Editar</a>
                    <form th:if="${p.ativo}" th:action="@{/admin/produtos/{id}/desativar(id=${p.id})}" method="post"
                          class="form-inline" onsubmit="return confirm('Desativar este produto? Ele sairá do catálogo.');">
                        <button type="submit" class="botao botao-perigo"
                                th:attr="aria-label=|Desativar ${p.nome}|">Desativar</button>
                    </form>
                    <form th:unless="${p.ativo}" th:action="@{/admin/produtos/{id}/ativar(id=${p.id})}" method="post" class="form-inline">
                        <button type="submit" class="botao"
                                th:attr="aria-label=|Reativar ${p.nome}|">Reativar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}">
        <a class="botao" th:if="${pagina.hasPrevious()}"
           th:href="@{/admin/produtos(termo=${termo},page=${pagina.number - 1})}" rel="prev">Anterior</a>
        <span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|">Página 1 de 1</span>
        <a class="botao" th:if="${pagina.hasNext()}"
           th:href="@{/admin/produtos(termo=${termo},page=${pagina.number + 1})}" rel="next">Próxima</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
