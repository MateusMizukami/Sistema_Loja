<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Endereços - Loja Vendas')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" class="container container-medio" aria-labelledby="titulo">
    <h1 id="titulo">Minha conta</h1>
    <nav th:replace="~{fragments/layout :: menuConta('enderecos')}"></nav>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <h2>Meus endereços</h2>

    <div class="vazio" th:if="${enderecos.empty}">
        <p>Você ainda não cadastrou nenhum endereço.</p>
    </div>

    <ul class="lista-cards" th:unless="${enderecos.empty}">
        <li class="card-endereco" th:each="e : ${enderecos}">
            <p th:text="${e.formatado()}">Endereço</p>
            <div class="acoes-linha">
                <a class="botao" th:href="@{/perfil/enderecos/{id}/editar(id=${e.id})}"
                   th:attr="aria-label=|Editar endereço ${e.logradouro}, ${e.numero}|">Editar</a>
                <form th:action="@{/perfil/enderecos/{id}/excluir(id=${e.id})}" method="post" class="form-inline"
                      onsubmit="return confirm('Excluir este endereço?');">
                    <button type="submit" class="botao botao-perigo"
                            th:attr="aria-label=|Excluir endereço ${e.logradouro}, ${e.numero}|">Excluir</button>
                </form>
            </div>
        </li>
    </ul>

    <p><a class="botao botao-destaque" th:href="@{/perfil/enderecos/novo}">Adicionar endereço</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
