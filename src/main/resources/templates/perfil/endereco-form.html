<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo} + ' - Loja Vendas')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" class="container container-medio" aria-labelledby="titulo">
    <h1 id="titulo" th:text="${titulo}">Endereço</h1>

    <form th:action="@{${acao}}" th:object="${endereco}" method="post" class="formulario" novalidate>
        <input type="hidden" name="retorno" th:if="${retorno != null}" th:value="${retorno}">

        <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" th:field="*{cep}" inputmode="numeric" autocomplete="postal-code"
                   placeholder="00000-000" required th:attr="aria-invalid=${#fields.hasErrors('cep')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></p>
        </div>

        <div class="campo">
            <label for="logradouro">Rua</label>
            <input type="text" id="logradouro" th:field="*{logradouro}" autocomplete="address-line1" required
                   th:attr="aria-invalid=${#fields.hasErrors('logradouro')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></p>
        </div>

        <div class="campo">
            <label for="numero">Número</label>
            <input type="text" id="numero" th:field="*{numero}" required
                   th:attr="aria-invalid=${#fields.hasErrors('numero')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></p>
        </div>

        <div class="campo">
            <label for="complemento">Complemento (opcional)</label>
            <input type="text" id="complemento" th:field="*{complemento}" autocomplete="address-line2"
                   th:attr="aria-invalid=${#fields.hasErrors('complemento')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></p>
        </div>

        <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" th:field="*{bairro}" required
                   th:attr="aria-invalid=${#fields.hasErrors('bairro')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></p>
        </div>

        <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" th:field="*{cidade}" autocomplete="address-level2" required
                   th:attr="aria-invalid=${#fields.hasErrors('cidade')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></p>
        </div>

        <div class="campo">
            <label for="estado">Estado (sigla)</label>
            <input type="text" id="estado" th:field="*{estado}" maxlength="2" autocomplete="address-level1"
                   placeholder="MS" required th:attr="aria-invalid=${#fields.hasErrors('estado')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></p>
        </div>

        <button type="submit" class="botao botao-destaque">Salvar endereço</button>
        <a class="link-limpar" th:href="${retorno != null} ? @{/checkout} : @{/perfil/enderecos}">Cancelar</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
