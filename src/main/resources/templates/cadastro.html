<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro - Loja Vendas')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" class="container container-estreito" aria-labelledby="titulo">
    <h1 id="titulo">Criar conta</h1>

    <form th:action="@{/cadastro}" th:object="${cadastro}" method="post" class="formulario" novalidate>

        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" th:field="*{nome}" autocomplete="name" required
                   th:attr="aria-invalid=${#fields.hasErrors('nome')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email" required
                   th:attr="aria-invalid=${#fields.hasErrors('email')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" autocomplete="new-password" required
                   aria-describedby="dica-senha"
                   th:attr="aria-invalid=${#fields.hasErrors('senha')}">
            <small id="dica-senha">Mínimo de 6 caracteres.</small>
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>
        </div>

        <div class="campo">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" autocomplete="new-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('confirmarSenha')}">
            <p class="erro-campo" role="alert" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></p>
        </div>

        <button type="submit" class="botao botao-destaque">Finalizar cadastro</button>
    </form>

    <p>Já tem conta? <a th:href="@{/login}">Entrar</a>.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
